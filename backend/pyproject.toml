[project]
name = "qa-automation-backend"
version = "0.1.0"
description = "QA Automation Platform — FastAPI control plane"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Migrations are dynamic (Alembic context); exclude from strict checking.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Alembic ships partial types; don't fail on its internals.
module = ["alembic.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.black]
target-version = ["py312"]
line-length = 88
