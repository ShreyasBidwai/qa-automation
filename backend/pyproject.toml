[project]
name = "qa-automation-backend"
version = "0.1.0"
description = "QA Automation Platform — FastAPI control plane"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Migrations are dynamic (Alembic context); exclude from strict checking.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Alembic ships partial types; don't fail on its internals.
module = ["alembic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# pgvector ships no type stubs; fastembed is an optional (embed-lane) dep absent
# from the lint image. Don't fail on either's missing types.
module = ["pgvector.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The fast suite excludes the real-tooling lanes: `runner` (PHP/Pest, run via
# `make test-runners`), `embed` (real fastembed, run via `make test-embeddings`),
# and `e2e_runner` (real Playwright browsers, run via `make test-e2e-runner`).
addopts = "-ra --cov=app --cov-report=term-missing -m 'not runner and not embed and not e2e_runner'"
markers = [
    "runner: real-tooling tests that require the runner image (PHP/Pest); run via `make test-runners`",
    "embed: real-embedding tests that require fastembed; run via `make test-embeddings`",
    "e2e_runner: real-browser tests that require the Playwright runner image; run via `make test-e2e-runner`",
]
# Tests are function-based; this naming convention stops pytest from trying to
# collect domain classes named Test* (TestCase, TestType, …) as test classes.
python_classes = ["*Tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.black]
target-version = ["py312"]
line-length = 88
