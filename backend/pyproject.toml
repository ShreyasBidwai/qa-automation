[project]
name = "qa-automation-backend"
version = "0.1.0"
description = "QA Automation Platform — FastAPI control plane"
requires-python = ">=3.12"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Migrations are dynamic (Alembic context); exclude from strict checking.
exclude = ["migrations/"]

[[tool.mypy.overrides]]
# Alembic ships partial types; don't fail on its internals.
module = ["alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# The fast suite excludes `runner`-marked tests (real PHP/Pest); those run only
# in the laravel runner image via `make test-runners`, which passes `-m runner`.
addopts = "-ra --cov=app --cov-report=term-missing -m 'not runner'"
markers = [
    "runner: real-tooling tests that require the runner image (PHP/Pest); run via `make test-runners`",
]
# Tests are function-based; this naming convention stops pytest from trying to
# collect domain classes named Test* (TestCase, TestType, …) as test classes.
python_classes = ["*Tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.black]
target-version = ["py312"]
line-length = 88
