<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playwright runner fixture</title>
  </head>
  <body>
    <!-- A deliberately tiny, stack-agnostic target page for the PlaywrightRunner
         integration lane. One known element + one interaction is enough to prove
         the runner drives a real browser against a real DOM and captures
         pass/fail outcomes. This is NOT AAHOA's frontend — the real adapter is a
         later task. -->
    <h1>Fixture Ready</h1>
    <button id="toggle" type="button" onclick="document.getElementById('status').textContent = 'clicked';">
      Toggle
    </button>
    <p id="status" data-testid="status">idle</p>

    <!-- A form + a backend fetch, for the FrontendCrawler integration lane: the
         crawler extracts the form and intercepts the /api/ping call, bridging it
         to a matching endpoint node (page → endpoint edge). The static fixture
         server need not actually serve /api/ping — the request is intercepted
         regardless of its response. -->
    <form action="/api/contact" method="post">
      <input name="email" type="email" required />
      <input name="message" type="text" />
      <button type="submit">Send</button>
    </form>
    <script>
      fetch("/api/ping").catch(function () {});
    </script>
  </body>
</html>
