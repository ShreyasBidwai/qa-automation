# Pre-commit hooks — fast local checks that mirror CI's linters/formatters.
# Install once with `pre-commit install` (see CONTRIBUTING.md).
#
# Backend (ruff/black) run in self-contained, pinned environments — no local
# Python needed. Frontend (eslint/prettier) run the project's own tooling and
# therefore require `cd frontend && npm ci` once; they only trigger when
# frontend files change.
minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files

  # Backend lint + format (versions pinned to match backend/pyproject.toml & CI).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^backend/.*\.py$
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        files: ^backend/.*\.py$

  # Frontend lint + format — uses the project's own eslint/prettier so versions
  # never drift from CI. Requires frontend deps installed (`cd frontend && npm ci`).
  - repo: local
    hooks:
      - id: prettier
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && npx prettier --check .'
        files: ^frontend/.*\.(ts|tsx|js|css|json|md|html)$
        pass_filenames: false
      - id: eslint
        name: eslint (frontend)
        language: system
        entry: bash -c 'cd frontend && npx eslint .'
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false
