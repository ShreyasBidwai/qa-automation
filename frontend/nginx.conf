# Single-origin serving for the packaged stack (docs/running.md): nginx serves
# the built SPA and reverse-proxies the API + health endpoints to the backend, so
# the browser stays same-origin (no CORS) and the client's default relative API
# base ("/api/v1") just works. `backend` is the compose service name.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Versioned API → backend (full original URI is forwarded, e.g. /api/v1/...).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Unversioned liveness/readiness probes the operator console calls.
    location = /healthz {
        proxy_pass http://backend:8000/healthz;
    }
    location = /readyz {
        proxy_pass http://backend:8000/readyz;
    }

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
