<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Polaris — QA automation platform</title>
    <!-- Sets the theme before first paint (ADR-0073) so an authenticated dark-mode
         user never sees a light flash while React boots. Dark is a signed-in surface:
         with no session token we always paint light, so the public front door
         (login / sign-up / landing) stays on the light brand. -->
    <script>
      (function () {
        try {
          var theme = "light";
          if (localStorage.getItem("polaris.auth.token")) {
            var stored = localStorage.getItem("polaris:theme");
            theme =
              stored === "light" || stored === "dark"
                ? stored
                : window.matchMedia &&
                    window.matchMedia("(prefers-color-scheme: dark)").matches
                  ? "dark"
                  : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (e.g. privacy mode) — default light.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (UI, weights 400/500/600) + JetBrains Mono (code/paths/IDs). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
