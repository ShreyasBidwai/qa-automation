# Test overlay — adds one-off test runners on top of the base dev stack
# (Standards §16: CI runs inside Docker and mirrors `docker compose`).
# Used via `make test`, which brings up db/backend/frontend (healthy) and then
# `docker compose run --rm` each runner. These services are never `up`ed.
name: ${COMPOSE_PROJECT_NAME:-qa-automation}

services:
  # Backend pytest — builds the dev/test image and runs against an isolated test
  # database it creates on the `db` service (see backend/tests/conftest.py).
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa_platform}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-qa_platform}
      LOG_LEVEL: WARNING
    depends_on:
      db:
        condition: service_healthy

  # Frontend Vitest — reuses the frontend image (devDeps + sources present) and
  # overrides the command. Unit tests mock the API client, so no backend needed.
  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: ["npx", "vitest", "run"]

  # Playwright E2E — loads the running frontend and asserts live backend health.
  e2e:
    build:
      context: ./tests/e2e
      dockerfile: Dockerfile
    environment:
      E2E_BASE_URL: http://frontend:5173
    depends_on:
      frontend:
        condition: service_healthy
