# Test overlay — adds one-off test/lint/audit runners on top of the base dev
# stack (Standards §16: CI runs inside Docker and mirrors `docker compose`).
# Used via `make test` / `make lint` / `make audit`, which `docker compose run`
# these services. They are never `up`ed. Report output is written to a mounted
# `.artifacts/` dir so CI can publish it.
name: ${COMPOSE_PROJECT_NAME:-qa-automation}

services:
  # Backend pytest — runs against an isolated test DB it creates on `db`
  # (backend/tests/conftest.py), writes coverage + junit reports, and enforces
  # the coverage gate on the services layer (~80%, Standards §15).
  backend-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa_platform}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-qa_platform}
      LOG_LEVEL: WARNING
    volumes:
      - ./.artifacts/backend:/app/.artifacts
    command:
      - sh
      - -c
      - >-
        pytest --cov-report=xml:.artifacts/coverage.xml
        --junitxml=.artifacts/junit.xml
        && coverage report --include='app/services/*' --fail-under=80
    depends_on:
      db:
        condition: service_healthy

  # Frontend Vitest — reuses the frontend image (devDeps + sources present).
  # Unit tests mock the API client, so no backend is needed.
  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    volumes:
      - ./.artifacts/frontend:/app/.artifacts
    command:
      - sh
      - -c
      - npx vitest run --reporter=default --reporter=junit --outputFile=.artifacts/junit.xml

  # Real-embedding lane — the real fastembed provider + an insert/search
  # round-trip against pgvector. Heavy (ONNX + model download); built/run only
  # via `make test-embeddings`, never in the fast suite. Needs the db.
  embed-tests:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: embed-test
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-qa_platform}:${POSTGRES_PASSWORD:-change-me-locally}@db:5432/${POSTGRES_DB:-qa_platform}
      LOG_LEVEL: WARNING
    volumes:
      - ./.artifacts/embed:/app/.artifacts
    command:
      - sh
      - -c
      - >-
        pytest -m embed --junitxml=.artifacts/junit.xml -p no:cacheprovider
    depends_on:
      db:
        condition: service_healthy

  # Laravel/Pest runner — real PHP/Pest against the bootable fixture app, plus
  # the PHP-helper shape test (closes T1.3 mock drift). Built/run only via
  # `make test-runners`; no Postgres (the target uses in-memory sqlite). Build
  # context is ./backend so the image bundles the backend code + the fixture; the
  # Dockerfile lives in runners/laravel/.
  runner-tests:
    build:
      context: ./backend
      dockerfile: ../runners/laravel/Dockerfile
    volumes:
      - ./.artifacts/runner:/work/.artifacts

  # Playwright RUNNER lane — the PlaywrightRunner (app/execution) drives a real
  # browser against a bundled static fixture page and maps outcomes to Results.
  # This is the execution adapter for GENERATED specs against a target app — NOT
  # the tool's own dashboard E2E (that is the `e2e` service below). Built/run only
  # via `make test-e2e-runner`; no Postgres (the fixture is a static page served
  # in-process by the test). Build context is the repo root so the image bundles
  # the backend code + fixture; the Dockerfile lives in runners/playwright/.
  e2e-runner-tests:
    build:
      context: .
      dockerfile: runners/playwright/Dockerfile
    volumes:
      - ./.artifacts/e2e-runner:/work/.artifacts

  # Playwright E2E — loads the running frontend and asserts live backend health.
  e2e:
    build:
      context: ./tests/e2e
      dockerfile: Dockerfile
    environment:
      E2E_BASE_URL: http://frontend:5173
      CI: "true"
    volumes:
      - ./.artifacts/e2e:/e2e/artifacts
    depends_on:
      frontend:
        condition: service_healthy
