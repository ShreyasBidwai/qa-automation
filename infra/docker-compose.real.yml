# Polaris — REAL-EXECUTION override (ADDITIVE; layered ON TOP of docker-compose.app.yml).
# Brought up via `make up-real`. Does NOT touch the stub `make up` path.
name: ${COMPOSE_PROJECT_NAME:-qa-automation}
services:
  backend:
    environment:
      EXECUTOR_MODE: orchestrator
      TARGET_CREDENTIALS_KEY: ${TARGET_CREDENTIALS_KEY:-}
  runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: real
    environment:
      EXECUTOR_MODE: orchestrator
      INGESTOR_MODE: laravel
      AI_PROVIDER_MODE: claude_cli
      AI_GENERATE_MODEL: ${AI_GENERATE_MODEL:-sonnet}
      EMBEDDING_PROVIDER: local
      GIT_TOKEN: ${GIT_TOKEN:-}
      TARGET_CREDENTIALS_KEY: ${TARGET_CREDENTIALS_KEY:-}
      HOME: /app
    volumes:
      - /home/dev84/.local/bin/claude:/usr/local/bin/claude:ro
      - /home/dev84/.local/share/claude:/app/.local/share/claude:ro
      - /home/dev84/.claude.json:/app/.claude.json:rw
      - /home/dev84/.claude:/app/.claude:rw
      - ${TARGET_REPO_HOST_PATH:-./targets/app}:/targets/app
