# Polaris — REAL-EXECUTION override (ADDITIVE; layered ON TOP of docker-compose.app.yml).
# Brought up via `make up-real`. Does NOT touch the stub `make up` path.
name: ${COMPOSE_PROJECT_NAME:-qa-automation}
services:
  backend:
    environment:
      EXECUTOR_MODE: orchestrator
      TARGET_CREDENTIALS_KEY: ${TARGET_CREDENTIALS_KEY:-}
  runner:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: real
    environment:
      EXECUTOR_MODE: orchestrator # compose the real OrchestratorRunExecutor
      INGESTOR_MODE: laravel # real Laravel ingestion (reads the checked-out repo)
      # Instance-default AI backend. Defaults to claude_cli (the host bridge, below),
      # but override in .env to anthropic_api | gemini to use a plain API key instead
      # of a host daemon — the keys are plumbed to the runner below. A PROJECT can also
      # override this per-project from the UI (agnostic selection).
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-claude_cli}
      AI_GENERATE_MODEL: ${AI_GENERATE_MODEL:-sonnet} # frontier model (generation)
      AI_TRIAGE_MODEL: ${AI_TRIAGE_MODEL:-claude-haiku-4-5} # cheap model (triage)
      EMBEDDING_PROVIDER: local # fastembed (downloads the model on first use)
      # API-key providers (used when AI_PROVIDER_MODE / a project picks them): the key
      # is a SECRET from the gitignored .env, sent to the upstream via a header, never
      # logged. Empty ⇒ that provider refuses clearly rather than calling unauthed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Generation runs `claude -p` on the HOST via the bridge daemon (`make bridge`),
      # so the container NEVER touches the host's ~/.claude login — no read-write,
      # cross-uid auth mount, hence no logout churn on up-real/down-real. The token is
      # shared with the daemon via the gitignored root .env (docs/running-real.md).
      CLAUDE_BRIDGE_URL: ${CLAUDE_BRIDGE_URL:-http://host.docker.internal:8787}
      CLAUDE_BRIDGE_TOKEN: ${CLAUDE_BRIDGE_TOKEN:-}
      GIT_TOKEN: ${GIT_TOKEN:-}
      TARGET_CREDENTIALS_KEY: ${TARGET_CREDENTIALS_KEY:-}
      HOME: /app # writable home for tool caches (fastembed, git)
    extra_hosts:
      # Resolve host.docker.internal to the host so the container can reach the
      # bridge daemon running on it (Docker 20.10+ on Linux).
      - "host.docker.internal:host-gateway"
    volumes:
      # The checked-out + composer-installed target repo. Ingest reads a LOCAL
      # checkout (clone-at-ingest is NOT yet wired), and Pest needs vendor/ present.
      # Clone it on the host, then set the project's repo_url to the in-container
      # path /targets/app (read-write: the runner writes vendor/ + generated tests).
      # NOTE: no ~/.claude mount — credentials stay on the host behind the bridge.
      - ${TARGET_REPO_HOST_PATH:-./targets/app}:/targets/app
